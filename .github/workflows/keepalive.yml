name: Keepalive

# GitHub disables schedule-triggered workflows in a public repository after 60 days
# without repository activity, and the monitor's own runs do not count. A commit on the
# first of every month keeps the repository active until the 25.11.2026 fixture.

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit a timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive: keep the scheduled monitor enabled"
          git push
